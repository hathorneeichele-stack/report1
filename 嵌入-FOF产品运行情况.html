<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品配置工作台｜FOF产品运行情况</title>
  <style>
    :root {
      --ink:#1f2a3d;
      --muted:#6d7788;
      --line:#e8edf5;
      --soft:#f5f7fb;
      --panel:#ffffff;
      --blue:#4268d6;
      --blue-soft:#eef3ff;
      --gold:#b99035;
      --gold-soft:#fff7e6;
      --red:#c9554d;
      --green:#2f9e62;
      --shadow:0 10px 24px rgba(28,41,70,.08);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      color:var(--ink);
      background:#f2f5fa;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      font-size:14px;
      line-height:1.45;
    }

    button,
    input,
    select { font:inherit; }

    .app { min-height:100vh; }

    .topbar {
      position:sticky;
      top:0;
      z-index:20;
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 28px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    .crumb {
      color:var(--muted);
      font-size:13px;
    }

    .crumb strong {
      margin-left:8px;
      color:var(--ink);
      font-size:16px;
    }

    .toolbar {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .search {
      width:300px;
      height:36px;
      border:1px solid var(--line);
      border-radius:6px;
      padding:0 12px;
      outline:none;
      background:#fafbfd;
      color:var(--ink);
    }

    .search:focus {
      border-color:#b8c7ff;
      box-shadow:0 0 0 3px rgba(66,104,214,.12);
    }

    .pill {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--blue-soft);
      color:var(--blue);
      font-weight:700;
      font-size:12px;
      white-space:nowrap;
    }

    .workspace {
      padding:24px 28px 96px;
    }

    .page-head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      margin-bottom:18px;
    }

    h1 {
      margin:0;
      color:var(--ink);
      font-size:24px;
      line-height:1.25;
      letter-spacing:0;
    }

    .meta {
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }

    .summary-grid {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .kpi {
      min-height:92px;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      box-shadow:var(--shadow);
    }

    .kpi span {
      display:block;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .kpi strong {
      display:block;
      margin-top:5px;
      color:var(--ink);
      font-size:24px;
      line-height:1.2;
    }

    .kpi em {
      display:block;
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      font-style:normal;
    }

    .product-tabs {
      position:sticky;
      top:64px;
      z-index:15;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
      padding:10px 0;
      background:#f2f5fa;
    }

    .tab-btn {
      min-height:86px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:12px 14px;
      background:#fff;
      color:var(--ink);
      text-align:left;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(28,41,70,.04);
    }

    .tab-btn:hover,
    .tab-btn.active {
      border-color:#b8c7ff;
      background:linear-gradient(180deg,#fff,#f8faff);
      box-shadow:var(--shadow);
    }

    .tab-btn strong {
      display:block;
      font-size:15px;
      line-height:1.32;
    }

    .tab-code {
      display:block;
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:0;
    }

    .tab-btn span {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:8px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .report-stack {
      display:grid;
      gap:18px;
    }

    .product-report {
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .product-report[hidden] { display:none; }

    .report-head {
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      background:#fbfcff;
    }

    .title-row {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .report-title {
      margin:0;
      font-size:20px;
      line-height:1.3;
    }

    .tag {
      display:inline-flex;
      align-items:center;
      min-height:24px;
      padding:3px 8px;
      border-radius:999px;
      background:var(--gold-soft);
      color:#8a6618;
      font-size:12px;
      font-weight:750;
      white-space:nowrap;
    }

    .brief {
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      font-weight:650;
      text-wrap:pretty;
    }

    .metric-card {
      border:1px solid #ead8b8;
      border-radius:8px;
      overflow:hidden;
      background:#fffaf2;
    }

    .metric-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      padding:8px 12px;
      border-bottom:1px solid rgba(185,144,53,.18);
      font-variant-numeric:tabular-nums;
    }

    .metric-row:last-child { border-bottom:0; }
    .metric-row span:first-child { color:#5c6470; }
    .metric-row strong { font-weight:750; }

    .section {
      padding:18px 20px;
      border-bottom:1px solid var(--line);
    }

    .section:last-child { border-bottom:0; }

    .section-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .section-title {
      margin:0;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:17px;
      line-height:1.25;
    }

    .section-title:before {
      content:"";
      width:4px;
      height:20px;
      border-radius:2px;
      background:#5f7be8;
    }

    .index-grid {
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:10px;
    }

    .index-card {
      min-height:62px;
      display:grid;
      align-content:center;
      gap:2px;
      padding:10px;
      border:1px solid #ead8b8;
      border-radius:8px;
      background:#fffdf8;
      text-align:center;
    }

    .index-card strong {
      font-size:15px;
      font-variant-numeric:tabular-nums;
    }

    .index-card span {
      color:#4d5666;
      font-size:12px;
      font-weight:700;
    }

    .pos { color:var(--red); font-weight:750; }
    .neg { color:var(--green); font-weight:750; }
    .flat { color:#6d7788; font-weight:750; }

    .chart-wrap {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(270px,360px);
      gap:16px;
      align-items:stretch;
    }

    .spark-panel {
      min-height:238px;
      border:1px solid var(--line);
      border-radius:8px;
      background:linear-gradient(180deg,#fff,#fbfcff);
      padding:12px;
    }

    .spark-panel svg {
      display:block;
      width:100%;
      height:250px;
    }

    .spark-grid line {
      stroke:#e7ecf4;
      stroke-width:1;
    }

    .axis-label {
      fill:#697386;
      font-size:12px;
      font-weight:650;
      font-variant-numeric:tabular-nums;
    }

    .axis-title {
      fill:#8a94a6;
      font-size:12px;
      font-weight:700;
    }

    .spark-line {
      fill:none;
      stroke:#d72b2b;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .spark-line.dark {
      stroke:#d9bd86;
    }

    .drawdown-zone {
      fill:rgba(68,70,75,.22);
    }

    .chart-side {
      display:grid;
      gap:10px;
    }

    .chart-notes {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }

    .side-note {
      padding:12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fbfcff;
    }

    .side-note strong {
      display:block;
      margin-bottom:5px;
      font-size:13px;
    }

    .side-note span {
      color:var(--muted);
      font-size:12px;
      font-weight:650;
    }

    .table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
    }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:980px;
    }

    th {
      position:sticky;
      top:0;
      z-index:1;
      padding:10px 12px;
      background:#edf2fb;
      color:#4c63b3;
      text-align:left;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    td {
      padding:10px 12px;
      border-top:1px solid var(--line);
      color:#2a3446;
      vertical-align:middle;
      white-space:nowrap;
      font-size:13px;
    }

    td.product-name {
      min-width:320px;
      white-space:normal;
      font-weight:650;
    }

    tbody tr:hover { background:#fffdf0; }

    tfoot td {
      border-top:2px solid #dfe7f5;
      background:#fbfcff;
      color:var(--ink);
      font-weight:900;
    }

    .total-label {
      text-align:right;
      color:#4c63b3;
    }

    .client-table th,
    .client-table td {
      text-align:center;
    }

    .client-table .total-label {
      text-align:center;
    }

    .client-summary {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .client-summary strong {
      color:var(--ink);
      font-size:13px;
    }

    .client-controls {
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .client-select {
      width:170px;
      height:34px;
      border:1px solid var(--line);
      border-radius:6px;
      padding:0 10px;
      outline:none;
      background:#fff;
      color:var(--ink);
      font-size:13px;
      font-weight:700;
    }

    .client-select:focus {
      border-color:#b8c7ff;
      box-shadow:0 0 0 3px rgba(66,104,214,.12);
    }

    .sortable-th { padding:0; }

    .sort-button {
      width:100%;
      min-height:38px;
      border:0;
      padding:9px 8px;
      background:transparent;
      color:inherit;
      cursor:default;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      font:inherit;
      font-weight:800;
    }

    .sort-icon {
      width:12px;
      color:#3659c9;
      font-size:12px;
      line-height:1;
    }

    .note {
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
    }

    .disclosure {
      display:grid;
      gap:6px;
      padding:14px 20px 18px;
      border-top:1px solid var(--line);
      background:#fbfcff;
      color:#6d7788;
      font-size:12px;
    }

    .empty {
      display:none;
      min-height:260px;
      place-items:center;
      border:1px dashed #cfd8e8;
      border-radius:8px;
      background:#fff;
      color:var(--muted);
      font-weight:700;
    }

    .empty.show { display:grid; }

    @media (max-width:900px) {
      .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .product-tabs { grid-template-columns:1fr; position:static; }
      .report-head,
      .chart-wrap { grid-template-columns:1fr; }
      .chart-notes { grid-template-columns:1fr; }
      .index-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    }

    @media (max-width:760px) {
      .topbar {
        position:static;
        align-items:flex-start;
        flex-direction:column;
        padding:14px 18px;
      }

      .toolbar,
      .search { width:100%; }

      .client-controls {
        width:100%;
        justify-content:flex-start;
      }

      .client-select { width:100%; }

      .workspace { padding:18px 18px 96px; }
      .page-head { display:block; }
      .summary-grid,
      .index-grid { grid-template-columns:1fr; }
    }
  </style>
</head>

    function valueTone(value) {
      const text = String(value ?? "");
      if (text.startsWith("-")) return "neg";
      if (text === "--") return "flat";
      return "pos";
    }

    function renderIndexCards() {
      return INDEX_PERFORMANCE.map(item => `
        <div class="index-card">
          <strong class="${item.tone}">${item.value}</strong>
          <span>${item.name}</span>
        </div>
      `).join("");
    }

    function renderRows(rows) {
      return rows.map(row => `
        <tr>
          <td class="product-name">${row[0]}</td>
          <td class="${valueTone(row[1])}">${row[1]}</td>
          <td class="${valueTone(row[2])}">${row[2]}</td>
          <td>${row[3]}</td>
          <td>${row[4]}</td>
          <td>${row[5]}</td>
        </tr>
      `).join("");
    }

    function renderClientRows(rows) {
      return rows.map(row => `
        <tr>
          <td>${row[0]}</td>
          <td>${row[1]}</td>
          <td class="flat">****${row[2]}</td>
          <td class="pos">${row[3]}</td>
        </tr>
      `).join("");
    }

    function clientTotal(rows) {
      return rows.reduce((sum, row) => sum + Number(row[3] || 0), 0).toFixed(1);
    }

    function optionList(values, selectedValue, allLabel) {
      return [`<option value="">${allLabel}</option>`].concat(values.map(value => {
        const selected = value === selectedValue ? " selected" : "";
        return `<option value="${value}"${selected}>${value}</option>`;
      })).join("");
    }

    function renderYAxis(ticks) {
      const top = 30;
      const bottom = 190;
      const step = ticks.length > 1 ? (bottom - top) / (ticks.length - 1) : 0;
      return ticks.map((label, index) => {
        const y = top + step * index + 4;
        return `<text class="axis-label" x="10" y="${y}" text-anchor="start">${label}</text>`;
      }).join("");
    }

    function renderXAxis(ticks) {
      return ticks.map(item => `
        <text class="axis-label" x="${item.x}" y="232" text-anchor="middle" transform="rotate(-34 ${item.x} 232)">${item.label}</text>
      `).join("");
    }

    function renderClientTable(product) {
      const branchOptions = [...new Set(product.clients.map(row => row[0]))].sort((a,b)=>a.localeCompare(b,"zh-CN"));

      const managerOptions = [...new Set(branchRows.map(row => row[1]))].sort((a,b)=>a.localeCompare(b,"zh-CN"));
      const activeManager = managerOptions.includes(currentManager) ? currentManager : "";
      const rows = (activeManager ? branchRows.filter(row => row[1] === activeManager) : branchRows)
        .slice()
        .sort((a,b) => Number(b[3] || 0) - Number(a[3] || 0));
      const emptyRow = `<tr><td colspan="4" class="flat">当前筛选条件下暂无该产品持仓客户。</td></tr>`;
      const rowHtml = rows.length ? renderClientRows(rows) : emptyRow;
      const total = clientTotal(rows);

          <div class="section-head">
            <h3 class="section-title">产品持仓客户</h3>
            <div class="client-controls" aria-label="${product.shortTitle}持仓客户筛选">
              <select class="client-select" data-client-filter="branch" aria-label="营业部筛选">

              </select>
              <select class="client-select" data-client-filter="manager" aria-label="员工筛选">
                ${optionList(managerOptions, activeManager, "全部员工")}
              </select>
            </div>
            <span class="client-summary"><strong>${rows.length}户</strong><span>保有金额 ${total} 万</span><span>产品代码 ${product.code}</span></span>
          </div>
          <div class="table-wrap">
            <table class="client-table">

                  <th>服务经理</th>
                  <th>客户号</th>
                  <th class="sortable-th" aria-sort="descending"><button class="sort-button" type="button" title="保有金额已按降序排列">保有金额（万）<span class="sort-icon">↓</span></button></th>

              </thead>
              <tbody>${rowHtml}</tbody>
              <tfoot>
                <tr>
                  <td class="total-label" colspan="3">当前营业部保有金额合计</td>

    const reportStack = document.getElementById("reportStack");
    const emptyState = document.getElementById("emptyState");
    const searchBox = document.getElementById("searchBox");
    let currentBranch = "";
    let currentManager = "";

    function renderReports() {
      const active = document.querySelector("[data-product-tab].active")?.dataset.productTab || "fof199";
      reportStack.innerHTML = PRODUCTS.map(renderReport).join("");
      document.querySelectorAll(".product-report").forEach(report => {
        report.hidden = report.id !== active;
      });
      applySearch();
    }

    reportStack.innerHTML = PRODUCTS.map(renderReport).join("");

    function setActiveProduct(productId) {
      document.querySelectorAll("[data-product-tab]").forEach(button => {
        button.classList.toggle("active", button.dataset.productTab === productId);
      });
      document.querySelectorAll(".product-report").forEach(report => {
        report.hidden = report.id !== productId;
      });
      searchBox.value = "";
      emptyState.classList.remove("show");
      reportStack.style.display = "";
    }

    function applySearch() {
      const keyword = searchBox.value.trim().toLowerCase();
      const reports = Array.from(document.querySelectorAll(".product-report"));
      if (!keyword) {
        const active = document.querySelector("[data-product-tab].active")?.dataset.productTab || "fof199";
        setActiveProduct(active);
        return;
      }
      let visibleCount = 0;
      document.querySelectorAll("[data-product-tab]").forEach(button => button.classList.remove("active"));
      reports.forEach(report => {
        const matched = report.dataset.search.toLowerCase().includes(keyword);
        report.hidden = !matched;
        if (matched) visibleCount += 1;
      });
      reportStack.style.display = visibleCount ? "" : "none";
      emptyState.classList.toggle("show", visibleCount === 0);
    }

    document.addEventListener("click", event => {
      const tab = event.target.closest("[data-product-tab]");
      if (!tab) return;
      setActiveProduct(tab.dataset.productTab);
    });

    document.addEventListener("change", event => {
      const filter = event.target.closest("[data-client-filter]");
      if (!filter) return;
      if (filter.dataset.clientFilter === "branch") {
        currentBranch = filter.value;
        currentManager = "";
      } else {
        currentManager = filter.value;
      }
      renderReports();
    });

    searchBox.addEventListener("input", applySearch);
    setActiveProduct("fof199");
